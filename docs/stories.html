<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Selector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="writing-archive">
        <select id="pdfPicker">
            <option value="jeden Edward Wojciechowski.pdf">
                jeden Edward Wojciechowski
            </option>
            <option value="the one Edward Wojciechowski.pdf">
                the one Edward Wojciechowski
            </option>
            <option value="Remmick Jones and Erick.pdf">
                Remmick Jones and Erick
            </option>
        </select>

        <iframe id="pdfViewer" src="jeden Edward Wojciechowski.pdf" width="60%" height="842"><a id="pdfadd" href="jeden Edward Wojciechowski.pdf" download>download it here</a></iframe>
    </div>

    <script>
        const picker = document.getElementById("pdfPicker");
        const viewer = document.getElementById("pdfViewer");
        const add = document.getElementById("pdfadd");

        picker.addEventListener("change", () => {
            viewer.src = picker.value;
            add.src = picker.value
        });
    </script>
</body>
</html>
