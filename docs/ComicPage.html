<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The shadow knight comics: Home</title>
    <link rel="stylesheet" href="Comic.css">
</head>
<body id="bod">
    <div id="main">
        <nav>
            <a href="ComicPage.html">Home</a>
        </nav>
        <div id="mainPanel">
            <div id="buttongs1">
                <button onclick="sizeIt(1)">+</button>
                <button onclick="balance()">=</button>
                <button onclick="sizeIt(-1)">-</button>
            </div>
            <img id="page">

            <div id="buttongs2">
                <div>
                    <button onclick="FirstChapter()">|<</button>
                    <button onclick="PrevChapter()"><</button>
                    <button onclick="NextChapter()">></button>
                    <button onclick="LastChapter()">>|</button>
                </div>
            </div>
        </div>

        <div>
            <div id="Chapters">
                <h4 onclick="Chapter(0)">Chapter 1: Morbid begginings :</h4>
                <ul>
                    <li onclick="Chapter(0)">Page 1</li>
                </ul>
                
            </div>
        </div>

        <footer>
            <img src="by_nc_sa.svg">
            
            <a href="https://www.tumblr.com/theknightofshadowsofficial"><img src="OIP-1340158279.jpg" width="40"></a>
            <a href="https://t.me/janJelikoslair"><img src="telegram-logo-icon-transparent-8990-1278299751.png" width="40"></a>
        </footer>
    </div>

    <script>

        var Chapters = ["page 1-3.png"]

        const page = document.getElementById("page");

        var i = 0
        page.src = Chapters[i]

        function NextChapter (){
            if(i == Chapters.length - 1){
                page.src = Chapters[i];
            }else{
                page.src = Chapters[i+1];
            }
        }

        function PrevChapter (){
            if(i>0){
                page.src = Chapters[i-1];
            }else{
                page.src = Chapters[0];
            }
        }

        function FirstChapter (){
            page.src = Chapters[0];
        }

        function LastChapter() {
            i = Chapters.length - 1;
            page.src = Chapters[i];
        }

        function Chapter (j){
            page.src = Chapters[j];
        }

        function balance(){
            page.style.width = "40%";
        }
        
        function sizeIt(int = 0) {
            

            let width = parseInt(page.style.width) || 40;
            width += int;

            page.style.width = width + "%";
        }

        const isSmallScreen = () => {
                return window.innerWidth <= 768;
            };

            if (isSmallScreen()) {
                console.log("Small screen detected");
                 document.getElementById("bod").width = "768"; 
            }

    </script>
</body>
</html>
